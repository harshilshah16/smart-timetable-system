<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STM - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f7f9fb",
                      "on-tertiary-fixed-variant": "#004395",
                      "on-secondary-fixed": "#0d1c2f",
                      "on-tertiary-container": "#3980f4",
                      "error-container": "#ffdad6",
                      "inverse-primary": "#bec6e0",
                      "tertiary": "#000000",
                      "on-secondary-fixed-variant": "#3a485c",
                      "on-primary-fixed": "#131b2e",
                      "surface-container": "#eceef0",
                      "on-surface-variant": "#45464d",
                      "surface": "#f7f9fb",
                      "on-tertiary": "#ffffff",
                      "secondary-fixed": "#d5e3fd",
                      "on-surface": "#191c1e",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-secondary-container": "#57657b",
                      "surface-container-highest": "#e0e3e5",
                      "outline-variant": "#c6c6cd",
                      "tertiary-container": "#001a42",
                      "secondary-fixed-dim": "#b9c7e0",
                      "surface-tint": "#565e74",
                      "outline": "#76777d",
                      "background": "#f7f9fb",
                      "surface-container-high": "#e6e8ea",
                      "tertiary-fixed": "#d8e2ff",
                      "primary-fixed": "#dae2fd",
                      "on-error": "#ffffff",
                      "secondary": "#515f74",
                      "on-primary-container": "#7c839b",
                      "surface-container-low": "#f2f4f6",
                      "on-background": "#191c1e",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#001a42",
                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",
                      "inverse-on-surface": "#eff1f3",
                      "primary-container": "#131b2e",
                      "inverse-surface": "#2d3133",
                      "surface-variant": "#e0e3e5",
                      "tertiary-fixed-dim": "#adc6ff",
                      "primary": "#000000",
                      "primary-fixed-dim": "#bec6e0",
                      "surface-dim": "#d8dadc",
                      "secondary-container": "#d5e3fd"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "unit": "4px",
                      "table-cell-padding": "12px 16px",
                      "margin-desktop": "32px",
                      "gutter": "24px",
                      "container-max": "1440px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "headline-lg": ["Inter"],
                      "mono-sm": ["JetBrains Mono"],
                      "display": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                      "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "mono-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                      "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                      "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-body-md">
<!-- Main Container -->
<main class="w-full max-w-[480px] px-margin-mobile md:px-0">
<!-- Brand Header -->
<div class="mb-8 text-center flex flex-col items-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="calendar_clock" style="font-variation-settings: 'FILL' 1;">calendar_clock</span>
</div>
<h1 class="font-display text-display text-primary"> STM </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Institutional Timetabling System</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-margin-desktop shadow-sm">
<form id="loginForm" class="space-y-6">
<!-- Role Selection -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface">Select Role</label>
<div class="grid grid-cols-3 gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="admin"/>
<div class="text-center py-2 border border-outline-variant rounded peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-primary peer-checked:font-bold transition-all hover:bg-surface-container-high">
<span class="font-label-md text-label-md">Admin</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="faculty"/>
<div class="text-center py-2 border border-outline-variant rounded peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-primary peer-checked:font-bold transition-all hover:bg-surface-container-high">
<span class="font-label-md text-label-md">Faculty</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="student"/>
<div class="text-center py-2 border border-outline-variant rounded peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-primary peer-checked:font-bold transition-all hover:bg-surface-container-high">
<span class="font-label-md text-label-md">Student</span>
</div>
</label>
</div>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface mb-1" for="institution-id">Institution ID</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent transition-shadow" id="institution-id" name="institution-id" placeholder="e.g. INS-10023" type="text" required/>
</div>
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface mb-1" for="username">Username</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent transition-shadow" id="username" name="username" placeholder="Staff or Student ID" type="text" required/>
</div>
<div class="relative">
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent transition-shadow" id="password" name="password" placeholder="••••••••" type="password" required/>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-surface-tint hover:text-on-primary transition-colors active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- System Status Footer -->
<div class="mt-8 text-center flex items-center justify-center gap-2 font-mono-sm text-mono-sm text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-[#10B981]"></span>
            System Status: All Services Operational
        </div>
</main>
<!-- Footer from JSON -->
<footer class="fixed bottom-0 bg-surface-container-lowest w-full py-4 mt-auto border-t border-outline-variant flex justify-between items-center px-margin-desktop z-40">
<p class="font-mono-sm text-mono-sm text-secondary opacity-90">© 2026 Modern Institutionalism Timetabling System. All rights reserved.</p>
<div class="flex gap-4">
<a class="font-mono-sm text-mono-sm text-on-surface-variant hover:text-primary hover:underline transition-all opacity-90 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-mono-sm text-mono-sm text-on-surface-variant hover:text-primary hover:underline transition-all opacity-90 hover:opacity-100" href="#">Terms of Service</a>
<a class="font-mono-sm text-mono-sm text-on-surface-variant hover:text-primary hover:underline transition-all opacity-90 hover:opacity-100" href="#">Security</a>
</div>
</footer>

<!-- JavaScript to handle dynamic routing on login -->
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default page refresh/form submit behavior
        
        // Find which role radio button is currently checked
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        
        // Route to the corresponding page based on the selected role
        if (selectedRole === 'admin') {
            window.location.href = 'admin.html';
        } else if (selectedRole === 'faculty') {
            window.location.href = 'faculty.html';
        } else if (selectedRole === 'student') {
            window.location.href = 'student.html';
        }
    });
</script>
</body>
</html>
